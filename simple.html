<!DOCTYPE html>
<html>
<head>
  <title>Simple Task Manager</title>
  <style>
    body {
      background: #0a0e1a;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    input, textarea, select, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #00f0a0;
      background: #1a2332;
      color: #fff;
    }
    button {
      background: #00f0a0;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.8;
    }
    .task {
      background: #1a2332;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #00f0a0;
    }
    .task button {
      margin: 0 5px;
      padding: 5px 10px;
      font-size: 14px;
    }
    .done {
      opacity: 0.5;
      text-decoration: line-through;
    }
    #status {
      background: #00f0a0;
      color: #000;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>✅ Simple Task Manager</h1>
  
  <div id="status">JavaScript is loading...</div>
  
  <div style="background: #1a2332; padding: 20px; border-radius: 10px; margin: 20px 0;">
    <h2>Add Task</h2>
    <input type="text" id="title" placeholder="Task title" style="width: 90%;">
    <br>
    <button onclick="addTask()">Add Task</button>
  </div>
  
  <div style="background: #1a2332; padding: 20px; border-radius: 10px;">
    <h2>Your Tasks (<span id="count">0</span>)</h2>
    <div id="tasks"></div>
  </div>

  <script>
    // This script is INLINE so it WILL work
    console.log('SCRIPT STARTED!');
    
    // Update status
    document.getElementById('status').textContent = '✅ JavaScript is WORKING!';
    document.getElementById('status').style.background = '#00f0a0';
    
    // Test if we can interact
    setTimeout(function() {
      console.log('Timer works!');
    }, 1000);
    
    // Global tasks array
    var allTasks = [];
    
    // Load from localStorage
    function loadTasks() {
      try {
        var saved = localStorage.getItem('simple_tasks');
        if (saved) {
          allTasks = JSON.parse(saved);
          console.log('Loaded', allTasks.length, 'tasks');
        }
      } catch (e) {
        console.error('Load error:', e);
      }
      renderTasks();
    }
    
    // Save to localStorage
    function saveTasks() {
      try {
        localStorage.setItem('simple_tasks', JSON.stringify(allTasks));
        console.log('Saved', allTasks.length, 'tasks');
      } catch (e) {
        console.error('Save error:', e);
      }
    }
    
    // Add new task
    function addTask() {
      console.log('addTask called!');
      
      var titleInput = document.getElementById('title');
      var title = titleInput.value.trim();
      
      if (!title) {
        alert('Please enter a task title');
        return;
      }
      
      var task = {
        id: Date.now(),
        title: title,
        done: false
      };
      
      allTasks.push(task);
      saveTasks();
      renderTasks();
      
      titleInput.value = '';
      console.log('Task added:', task);
    }
    
    // Toggle task done
    function toggleTask(id) {
      console.log('toggleTask called:', id);
      
      for (var i = 0; i < allTasks.length; i++) {
        if (allTasks[i].id === id) {
          allTasks[i].done = !allTasks[i].done;
          break;
        }
      }
      
      saveTasks();
      renderTasks();
    }
    
    // Delete task
    function deleteTask(id) {
      console.log('deleteTask called:', id);
      
      if (!confirm('Delete this task?')) {
        return;
      }
      
      allTasks = allTasks.filter(function(task) {
        return task.id !== id;
      });
      
      saveTasks();
      renderTasks();
    }
    
    // Render all tasks
    function renderTasks() {
      console.log('Rendering', allTasks.length, 'tasks');
      
      var container = document.getElementById('tasks');
      var countEl = document.getElementById('count');
      
      countEl.textContent = allTasks.length;
      
      if (allTasks.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666;">No tasks yet. Add one above!</p>';
        return;
      }
      
      var html = '';
      
      for (var i = 0; i < allTasks.length; i++) {
        var task = allTasks[i];
        var doneClass = task.done ? ' done' : '';
        
        html += '<div class="task' + doneClass + '">';
        html += '<strong>' + task.title + '</strong><br>';
        html += '<button onclick="toggleTask(' + task.id + ')">' + (task.done ? 'Undo' : 'Done') + '</button>';
        html += '<button onclick="deleteTask(' + task.id + ')">Delete</button>';
        html += '</div>';
      }
      
      container.innerHTML = html;
      console.log('Rendered!');
    }
    
    // Press Enter to add
    document.getElementById('title').onkeypress = function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    };
    
    // Initialize
    console.log('Initializing...');
    loadTasks();
    console.log('Ready!');
  </script>
</body>
</html>
